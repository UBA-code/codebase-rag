[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fire>=0.7.1",
    "pydantic>=2.13.5",
    "rank-bm25>=0.2.2",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]

[project.scripts]
rag = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


